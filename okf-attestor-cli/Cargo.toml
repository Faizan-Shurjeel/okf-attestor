[package]
name = "okf-attestor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for offline, deterministic OKF Attested Computation verification"
readme = "../README.md"
keywords = ["okf", "attestation", "wasm", "cli"]
categories = ["command-line-utilities", "wasm"]
exclude = ["tests/**"]

[[bin]]
name = "okf-attestor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
okf-attestor-core = { path = "../okf-attestor-core", version = "0.1.0" }
serde_json = "1.0.145"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
